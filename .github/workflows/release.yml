name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sanji-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/sanji-release.jks" >> $GITHUB_ENV

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SANJI_APP_VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          SANJI_APP_VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          DEST="dist/sanji-bomber-pro-${{ steps.ver.outputs.version_name }}.apk"
          cp "$SRC" "$DEST"
          sha256sum "$DEST" > "$DEST.sha256"
          ls -lah dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: "Sanji Bomber Pro ${{ steps.ver.outputs.version_name }}"
          body: |
            ## Sanji Bomber Pro ${{ steps.ver.outputs.version_name }}

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### Install
            1. Download the APK below
            2. Enable "Install from unknown sources"
            3. Install and sign in with Google

            ### Changes
            See commit history: https://github.com/${{ github.repository }}/commits/${{ github.sha }}
          files: |
            dist/*.apk
            dist/*.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}