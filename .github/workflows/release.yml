name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.319) — must match app/version.properties'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Read version from version.properties
        id: ver
        run: |
          CODE=$(grep -E '^VERSION_CODE=' app/version.properties | cut -d= -f2 | tr -d '[:space:]')
          NAME=$(grep -E '^VERSION_NAME=' app/version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "Building version: $NAME (code $CODE)"

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=${{ github.event.inputs.version }}
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sanji-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/sanji-release.jks" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          DEST="dist/sanji-bomber-pro-${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          sha256sum "$DEST" > "$DEST.sha256"
          ls -lah dist/

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Sanji Bomber Pro ${{ steps.ver.outputs.name }}"
          body: |
            ## Sanji Bomber Pro ${{ steps.ver.outputs.name }}

            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### Install
            1. Download the APK below
            2. Enable "Install from unknown sources"
            3. Install and sign in with Google

            ### Changes
            See commit history: https://github.com/${{ github.repository }}/commits/${{ github.sha }}
          files: |
            dist/*.apk
            dist/*.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Firestore (force update old users)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/sanji-bomber-pro-${{ steps.ver.outputs.name }}.apk
          CHANGELOG: "New version ${{ steps.ver.outputs.name }} released"
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret missing — skipping Firestore update"
            exit 0
          fi
          pip install firebase-admin
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          python3 - <<'PYEOF'
          import os, json
          import firebase_admin
          from firebase_admin import credentials, firestore

          sa_path = os.environ['RUNNER_TEMP'] + '/firebase-sa.json'
          cred = credentials.Certificate(sa_path)
          firebase_admin.initialize_app(cred)
          db = firestore.client()

          version_name = os.environ['VERSION_NAME']
          apk_url = os.environ['APK_URL']
          changelog = os.environ['CHANGELOG']

          db.collection('settings').document('global').set({
              'latestVersion': version_name,
              'minVersion': version_name,
              'apkUrl': apk_url,
              'changelog': changelog,
              'forceUpdate': False,
          }, merge=True)
          print(f"Firestore updated: minVersion={version_name}")
          PYEOF